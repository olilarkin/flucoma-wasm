name: wasm

# CI for the @olilarkin/flucoma-wasm npm package: builds the WebAssembly modules from
# source and runs the test suite on every push and pull request.
#
# The built modules are not committed (see .gitignore), so this is what proves
# the Emscripten build still works against the current flucoma-core. The build
# itself lives in build-npm-package.yml, shared with nightly.yaml and
# release.yml.

on:
  push:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'test/**'
      - 'scripts/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'package.json'
      - '.github/workflows/wasm.yml'
      - '.github/workflows/build-npm-package.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    uses: ./.github/workflows/build-npm-package.yml
