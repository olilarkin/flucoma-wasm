name: release

# Publishes the @olilarkin/flucoma-wasm npm package at the version committed in
# package.json, under the default `latest` dist-tag.
#
# Run it from the Actions tab, or push a `v<version>` tag matching package.json.
# Bump the version in package.json and commit it first — the release is a
# publish of what is committed, not a version bump of its own.
#
# Requires an NPM_TOKEN secret: an npm automation token belonging to the
# @olilarkin scope, with publish rights.

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  # Fail before spending ~20 minutes on an Emscripten build that could never be
  # published: npm versions are immutable, so a version already on the registry
  # is a dead end whatever the tarball turns out to contain.
  check:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Read from package.json rather than hardcoded, so renaming the package
      # never leaves this workflow checking the registry for the old name.
      - id: version
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Check the version is not already published
        run: |
          pkg="${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}"
          # `npm view` 404s for a package (or version) that does not exist yet,
          # which is exactly the case we want to proceed in.
          if npm view "$pkg" version >/dev/null 2>&1; then
            echo "$pkg is already published — bump the version in package.json." >&2
            exit 1
          fi
          echo "$pkg is not on the registry yet"

  build:
    needs: check
    uses: ./.github/workflows/build-npm-package.yml

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish "${{ needs.build.outputs.tarball }}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          {
            echo "Published \`${{ needs.check.outputs.name }}@${{ needs.check.outputs.version }}\` to npm."
            echo
            echo '```'
            echo "npm install ${{ needs.check.outputs.name }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
