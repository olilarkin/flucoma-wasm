name: nightly

# Publishes a nightly build of the @olilarkin/flucoma-wasm npm package from main,
# under the `nightly` dist-tag, so a plain install keeps resolving to the last
# real release:
#
#   npm install @olilarkin/flucoma-wasm@nightly
#
# Requires an NPM_TOKEN secret: an npm automation token belonging to the
# @olilarkin scope, with publish rights.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A nightly needs a version npm has never seen. The base is whatever
  # package.json is on its way to, with the prerelease part replaced rather than
  # appended so re-running after a bump can't produce nested `-nightly` suffixes.
  # The sha is prefixed with `g` (git-describe style) because a bare hex sha can
  # start with a 0, and a numeric semver identifier may not have a leading zero.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: compute
        run: |
          base=$(node -p "require('./package.json').version.split('-')[0]")
          version="$base-nightly.$(date -u +%Y%m%d%H%M).g${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "nightly version: $version"

  build:
    needs: version
    uses: ./.github/workflows/build-npm-package.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm under the nightly tag
        run: npm publish "${{ needs.build.outputs.tarball }}" --tag nightly --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          {
            echo "Published \`${{ needs.build.outputs.name }}@${{ needs.version.outputs.version }}\` to the \`nightly\` tag."
            echo
            echo '```'
            echo "npm install ${{ needs.build.outputs.name }}@nightly"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
